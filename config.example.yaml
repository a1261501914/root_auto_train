# Paths are relative to this file. Use Python 3.11-3.13 with PyTorch.
model_config: configs/root_segformer_b2.yml
checkpoint: model/model.pt
train_manifest: data/train.jsonl
val_manifest: data/val.jsonl
unlabeled_dir: data/unlabeled
workdir: runs/experiment_001
device: gpu
seed: 42
rounds: 3
iters: 1000
batch_size: 2
learning_rate: 0.00001
root_confidence: 0.95
consistency: 0.95
pixel_confidence: 0.9
min_coverage: 0.5
min_root_pixels: 20
max_pseudo_ratio: 1.0
min_delta: 0.001
auto_train: true
auto_train_dice: 0.85
agent_backend: deepagents  # legacy 可切回旧的单次 JSON 路由

# 自然语言指令；Key 只从环境变量读取，不写入配置。
qwen:
  model: qwen3.8-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  timeout: 60
